<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拟物书架</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <h1 data-i18n="title">我的书架</h1>
    <div class="actions">
      <span id="count" class="muted"></span>
      <button id="add" class="primary" hidden data-i18n="add">添加书</button>
      <input id="file" type="file" accept="image/jpeg,image/png" hidden>
    </div>
  </header>
  <section id="jobs" aria-live="polite"></section>
  <main id="shelf" aria-label="Bookshelf"></main>
  <p id="empty" class="muted center" hidden data-i18n="empty">书架还是空的。拍一张书脊朝外的照片开始吧。</p>

  <dialog id="consent">
    <h2 data-i18n="consentTitle">同意照片共享与 AI 处理？</h2>
    <p data-i18n="consentBody">照片会发送到你在本站配置的 AI 服务，用于识别书籍并生成书脊图。照片可能拍到背景内容，请确认没有不愿分享的信息。上传前会移除照片中的拍摄位置等信息。</p>
    <div class="row end"><button data-close data-i18n="cancel">取消</button><button id="agree" class="primary" data-i18n="agree">同意并上传</button></div>
  </dialog>

  <dialog id="edit">
    <form id="editForm" method="dialog">
      <h2 id="editTitle"></h2>
      <img id="editSpine" alt="">
      <label><span data-i18n="fTitle">书名</span><input name="title" required maxlength="200"></label>
      <label><span data-i18n="fAuthor">作者</span><input name="author" maxlength="200"></label>
      <label><span data-i18n="fStatus">状态</span>
        <select name="status"><option value="unread" data-i18n="unread">未读</option><option value="reading" data-i18n="reading">在读</option><option value="read" data-i18n="read">读完</option></select></label>
      <div class="row"><label><span data-i18n="fStarted">开始</span><input type="date" name="started"></label><label><span data-i18n="fFinished">读完</span><input type="date" name="finished"></label></div>
      <label><span data-i18n="fNote">笔记</span><textarea name="note" rows="3" maxlength="2000"></textarea></label>
      <p id="editError" class="error"></p>
      <div class="row between"><button type="button" id="delete" class="danger" data-i18n="delete">从书架移除</button>
        <span><button type="button" data-close data-i18n="cancel">取消</button><button id="save" class="primary" data-i18n="save">保存</button></span></div>
    </form>
  </dialog>
</body>
</html>
